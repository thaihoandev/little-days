services:
  app:
    image: ${APP_IMAGE:-little-days:staging}
    environment:
      APP_ORIGIN: https://${APP_DOMAIN:?Set APP_DOMAIN}
      COOKIE_SECURE: 'true'
      TRUST_PROXY_HOPS: '1'
      OPS_TOKEN_FILE: /run/secrets/ops-token
    secrets: [ops-token]
  worker:
    image: ${APP_IMAGE:-little-days:staging}
  proxy:
    image: caddy:2-alpine
    ports: ['80:80', '443:443', '443:443/udp']
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.retention.time=15d']
    ports: ['127.0.0.1:9090:9090']
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    secrets: [ops-token]
    restart: unless-stopped
secrets:
  ops-token:
    file: ./.secrets/ops-token
volumes:
  caddy_data:
  caddy_config:
  prometheus_data:
