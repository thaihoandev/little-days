name: Application checks
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run test:api
      - run: npm run test:auth
      - run: npm run test:deletion
      - run: npm run test:smtp
      - run: npm run test:mail
      - run: npm run test:s3
      - run: npm run test:cloudinary
      - run: npm run test:backup
      - run: npm run test:api
        env:
          SMOKE_STORAGE: cloudinary
      - run: npm run test:migration
        env:
          SMOKE_STORAGE: cloudinary
      - run: npm run test:migration
      - run: npm run test:api
        env:
          SMOKE_STORAGE: s3
      - run: npm run build
      - run: npm run test:ops
      - run: npm run test:production
      - run: npm run video:browser
      - name: API and two workers render through S3 fixture
        run: npm run test:workers
      - name: Custom audio, scene timing and two workers through Cloudinary fixture
        run: npm run test:video
        env:
          SMOKE_STORAGE: cloudinary
      - run: npm run test:load
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: test-results/
          retention-days: 7
  postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: scrapbook
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: scrapbook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scrapbook -d scrapbook_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://scrapbook:ci-test-only@127.0.0.1:5432/scrapbook_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run video:browser
      - run: npm run test:postgres
      - run: npm run test:scheduled-backup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgresql-verification
          path: test-results/
          retention-days: 7
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: docker build -t little-days:ci .
      - run: npm run test:container
        env:
          QA_IMAGE: little-days:ci
      - run: docker compose --env-file .env.staging.example -f compose.yaml -f deploy/staging.yaml config --quiet
      - run: docker run --rm --entrypoint promtool -v "$PWD/deploy:/etc/prometheus:ro" prom/prometheus:v3.5.0 check config --syntax-only /etc/prometheus/prometheus.yml
      - run: docker run --rm --entrypoint promtool -v "$PWD/deploy:/etc/prometheus:ro" prom/prometheus:v3.5.0 check rules /etc/prometheus/alerts.yml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-verification
          path: test-results/
          retention-days: 7
