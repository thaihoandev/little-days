name: Render keep-alive

on:
  workflow_dispatch:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'

permissions: {}

concurrency:
  group: render-keepalive
  cancel-in-progress: false

jobs:
  ping:
    if: github.repository == 'thaihoandev/little-days' && github.ref == 'refs/heads/main' && !github.event.repository.fork && vars.RENDER_KEEPALIVE_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping the Render web service
        shell: bash
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/render-keepalive.json"
          curl --fail --silent --show-error \
            --proto '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 60 \
            --retry 2 --retry-delay 5 --retry-max-time 180 \
            --header 'Cache-Control: no-cache' \
            --user-agent 'Little-Days-Keepalive/1.0' \
            --output "$response_file" \
            'https://little-days-api.onrender.com/legal-info.json'
          python3 - "$response_file" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as response:
              payload = json.load(response)
          if not isinstance(payload, dict) or payload.get("name") != "Little Days":
              raise SystemExit("Unexpected Render response; expected Little Days metadata.")
          print("Render responded with valid Little Days metadata.")
          PY
          echo 'Render ping succeeded. Scheduled every 10 minutes; GitHub scheduling can be delayed.' >> "$GITHUB_STEP_SUMMARY"
